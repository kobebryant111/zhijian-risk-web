# 激活方式：
#   mvn spring-boot:run -Dspring-boot.run.profiles=mysql
#   或 java -jar app.jar --spring.profiles.active=mysql
#
# 连接信息请二选一配置（勿把真实密码提交进仓库）：
#   1) 复制 application-mysql-local.yml.example 为 application-mysql-local.yml 后填写
#   2) 或设置环境变量 MYSQL_URL / MYSQL_USERNAME / MYSQL_PASSWORD
#
# 建表脚本：src/main/resources/db/mysql/schema.sql（或 docs/sql/schema-mysql.sql）
# 建议先手工执行 schema.sql，再启动；ddl-auto 默认 validate。

spring:
  config:
    import: optional:classpath:application-mysql-local.yml
  datasource:
    url: ${MYSQL_URL:}
    username: ${MYSQL_USERNAME:}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

logging:
  level:
    org.hibernate.SQL: INFO
