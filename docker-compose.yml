services:
  mysql:
    image: mysql:8.0
    container_name: zhijian-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: zhijian_risk
      MYSQL_USER: zhijian
      MYSQL_PASSWORD: zhijian
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./backend/src/main/resources/db/mysql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
  redis:
    image: redis:7
    container_name: zhijian-redis
    ports:
      - "6379:6379"
